name: everyones_tone
description: "밤하늘 - 목소리로 소통하는 음성 SNS"

version: 1.0.0+1

environment:
  sdk: ">=3.2.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  provider: ^6.1.1
  path_provider: ^2.1.5
  intl: ^0.19.0
  webview_flutter: ^4.5.0
  path: ^1.8.3
  get_it: ^7.6.7
  google_fonts: ^6.1.0
  flutter_native_splash: ^2.4.4
  record: 6.1.2
  just_audio: ^0.9.42
  go_router: ^14.6.2
  firebase_core: ^3.12.1
  cloud_firestore: ^5.6.6
  firebase_auth: ^5.5.2
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^7.0.1
  firebase_storage: ^12.4.4
  logger: ^2.6.0
  build_runner: ^2.4.13
  json_serializable: ^6.9.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  patrol: ^3.11.2

  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

dependency_overrides:
  record_android: 1.3.3

# 앱 아이콘 설정
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/the_night_sky.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/the_night_sky.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/images/the_night_sky.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/the_night_sky.png"

# 앱 스플래시 설정
flutter_native_splash:
  color: "#07243A"
  image: "assets/images/main_app_icon_image.png"

# 앱 에셋 설정
flutter:
  assets:
    - assets/icons/
    - assets/images/

  uses-material-design: true

patrol:
  app_name: "밤하늘"
  test_directory: integration_test
  android:
    package_name: "com.example.everyones_tone"
  ios:
    bundle_id: "com.example.everyonesTone"
